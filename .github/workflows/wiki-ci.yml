name: Wiki CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wiki-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest

    steps:
      - name: Reject unauthorized main pushes
        if: github.event_name == 'push' && github.actor != 'thepollitosd'
        run: |
          echo "Direct pushes to main are reserved for thepollitosd. Open a pull request instead."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'thepollitosd'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wiki-5025.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy docs/.vitepress/dist --project-name wiki-5025 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
